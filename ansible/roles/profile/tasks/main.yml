---
- name: Download microservice-app archive
  get_url:
    url: "{{ app_download_url }}"
    dest: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"

- name: Extract microservice-app archive
  unarchive:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/microservice-app-{{ app_version }}-linux-amd64"

- name: Install profile binary
  copy:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64/profile"
    dest: "{{ install_dir }}/profile"
    mode: "0755"
    remote_src: yes

- name: Install profile systemd service
  template:
    src: profile.service.j2
    dest: /etc/systemd/system/profile.service
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start profile
  systemd:
    name: profile
    enabled: yes
    state: started
