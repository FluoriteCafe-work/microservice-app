---
- name: Download etcd archive
  get_url:
    url: "{{ etcd_download_url }}"
    dest: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"

- name: Extract etcd archive
  unarchive:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/etcd-{{ etcd_version }}-linux-amd64/etcd"

- name: Install etcd binaries
  copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "{{ install_dir }}/{{ item }}"
    mode: "0755"
    remote_src: yes
  loop:
    - etcd
    - etcdctl

- name: Install etcd systemd service
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start etcd
  systemd:
    name: etcd
    enabled: yes
    state: started
