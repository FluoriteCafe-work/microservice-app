---
- name: Download microservice-app archive
  get_url:
    url: "{{ app_download_url }}"
    dest: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"

- name: Extract microservice-app archive
  unarchive:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/microservice-app-{{ app_version }}-linux-amd64"

- name: Install apigateway binary
  copy:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64/apigateway"
    dest: "{{ install_dir }}/apigateway"
    mode: "0755"
    remote_src: yes

- name: Install apigateway systemd service
  template:
    src: apigateway.service.j2
    dest: /etc/systemd/system/apigateway.service
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start apigateway
  systemd:
    name: apigateway
    enabled: yes
    state: started
