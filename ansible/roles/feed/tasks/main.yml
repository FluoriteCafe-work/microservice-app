---
- name: Download microservice-app archive
  get_url:
    url: "{{ app_download_url }}"
    dest: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"

- name: Extract microservice-app archive
  unarchive:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/microservice-app-{{ app_version }}-linux-amd64"

- name: Install feed binary
  copy:
    src: "/tmp/microservice-app-{{ app_version }}-linux-amd64/feed"
    dest: "{{ install_dir }}/feed"
    mode: "0755"
    remote_src: yes

- name: Install feed systemd service
  template:
    src: feed.service.j2
    dest: /etc/systemd/system/feed.service
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start feed
  systemd:
    name: feed
    enabled: yes
    state: started
